name: ecclesias_360
description: "Ecclésias360 — plateforme intégrée de gestion ecclésiastique (Global Service Groupe)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  provider: ^6.1.2
  go_router: ^14.0.0
  drift: ^2.35.0
  sqlite3_flutter_libs: ^0.5.24
  sqlite3: ^3.5.2
  path_provider: ^2.1.4
  path: ^1.9.0
  supabase_flutter: ^2.17.2
  flutter_dotenv: ^5.2.1
  flutter_secure_storage: ^9.2.2
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.35.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/config/
